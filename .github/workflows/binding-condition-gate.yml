name: binding-condition-gate

on:
  push:
    branches:
      - "binding-condition-gate-*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned OpenAI Agents SDK and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install "openai-agents @ git+https://github.com/openai/openai-agents-python.git@d59fdb8a789a54aff77ce61e503a04797355fc03" pytest
      - name: Compile binding-condition package
        run: python -m compileall -q binding_condition
      - name: Run binding-condition tests
        run: PYTHONPATH=. pytest -q tests/test_binding_condition_gate.py tests/test_binding_condition_sdk_integration.py
